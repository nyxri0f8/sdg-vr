<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#19486A" />
  <meta name="description" content="Explore the 17 UN Sustainable Development Goals in virtual reality. Built for Meta Quest 2, controlled with head gaze only." />
  <title>SDG VR</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="loading">Loading SDG VR…</div>

  <!-- 2D navigation for laptop / phone. Hidden inside VR, where the 3D bar is used instead. -->
  <nav id="nav2d" aria-label="Goal navigation">
    <button id="prev2d" aria-label="Previous goal">&#9664;</button>
    <select id="select2d" aria-label="Choose a goal"></select>
    <button id="next2d" aria-label="Next goal">&#9654;</button>
  </nav>
  <!-- Big, obvious VR entry with a visible status line, so problems on the headset are easy to see. -->
  <div id="vrgate">
    <button id="enterVr" disabled>Checking VR…</button>
    <p id="vrstatus">Checking whether this browser supports WebXR…</p>
  </div>

  <div id="hint2d">Drag to look around · Hold your gaze on an object for 1.5 s (or click it) · On Quest press <b>ENTER VR</b></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
